name: PHP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gmp, openssl
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Execute tests
        run: vendor/bin/phpunit --stop-on-error --debug

  analyse:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: '8.5'
          extensions: gmp, openssl
          tools: phpstan, php-cs-fixer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan (level 9)
        run: phpstan analyse

      - name: PHP-CS-Fixer (PSR-12)
        run: php-cs-fixer fix --dry-run --diff

  compat-lowest:
    name: Compat Lowest (PHP 8.0 / lowest deps)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: '8.0'
          extensions: gmp, openssl

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install lowest dependencies
        run: composer update --no-interaction --prefer-lowest --prefer-stable

      - name: Execute lowest-version tests
        run: vendor/bin/phpunit --stop-on-error

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: '8.5'
          extensions: gmp, openssl

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit
