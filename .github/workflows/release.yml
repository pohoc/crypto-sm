name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release-tag-created]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or resume, for example v0.4.0-rc.1
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Resolve and validate the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push) TAG="$PUSH_TAG" ;;
            repository_dispatch) TAG="$DISPATCH_TAG" ;;
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [[ "$TAG" == v* ]]
          php scripts/ReleaseVersion.php "${TAG#v}" --allow-existing >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag ancestry and CI Gate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          SHA="$(git rev-parse "$TAG^{commit}")"
          test "$SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SHA" origin/main

          CHECKS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | {name, head_sha, status, conclusion, started_at}' | jq -s '.')"
          GATE="$(jq -r --arg sha "$SHA" '[.[] | select(.name == "full-ci / CI Gate" and .head_sha == $sha)] | sort_by(.started_at) | last // {} | if .status == "completed" and .conclusion == "success" then "success" else (.conclusion // .status // "missing") end' <<< "$CHECKS")"
          if [[ "$GATE" != success ]]; then
            echo "::error::CI Gate for $SHA is '$GATE'; release is blocked."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Prepare changelog and reviewed draft Release
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          fetch-depth: 0

      - name: Inspect existing Release for safe retry
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          TAG_SHA: ${{ needs.validate-tag.outputs.sha }}
        run: |
          set -euo pipefail
          RELEASE_JSON=''
          if ! RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"; then
            if ! grep -q 'HTTP 404' <<< "$RELEASE_JSON"; then
              echo '::error::Could not determine Release state. No write was attempted; inspect GitHub and retry.'
              exit 1
            fi
            RELEASE_JSON=''
          fi

          RELEASE_FILE='-'
          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_FILE="$RUNNER_TEMP/release.json"
            printf '%s' "$RELEASE_JSON" > "$RELEASE_FILE"
          fi
          ACTION="$(php scripts/ReleaseVersion.php --release-state "$TAG" "$TAG_SHA" "$TAG_SHA" "$RELEASE_FILE")"
          if [[ "$ACTION" == resume-release ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            if [[ "$ACTION" == draft-exists ]]; then
              echo "Release $TAG is already a matching draft; review its notes and publish it manually."
            else
              echo "Release $TAG is already published; no duplicate was created."
            fi
          fi

      - name: Set up PHP
        if: steps.existing.outputs.exists == 'false'
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Generate changelog and reviewed release-note draft
        if: steps.existing.outputs.exists == 'false'
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          composer changelog
          cp CHANGELOG.md "$RUNNER_TEMP/generated-CHANGELOG.md"
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { in_release = 1; next }
            in_release && index($0, "## [") == 1 { exit }
            in_release && index($0, "]: https://") > 0 { exit }
            in_release { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/version-changelog.md"
          test -s "$RUNNER_TEMP/version-changelog.md"
          {
            printf '# Release %s\n\n' "$TAG"
            printf '## Breaking Changes\n\nReview and document every breaking change before publishing.\n\n'
            printf '## Migration Guide\n\nSee [docs/migration.md](https://github.com/%s/blob/main/docs/migration.md).\n\n' "$GITHUB_REPOSITORY"
            printf '## Security Fixes\n\nReview and summarize security fixes included in this release.\n\n'
            printf '## Upgrade Requirements\n\nConfirm PHP and extension requirements, including PHP 8.2+.\n\n'
            printf '## Commit Changelog\n\n'
            cat "$RUNNER_TEMP/version-changelog.md"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create changelog pull request and run its CI
        id: changelog
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          TAG_SHA: ${{ needs.validate-tag.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git merge-base --is-ancestor "$TAG_SHA" origin/main
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-CHANGELOG.md"
          if grep -Fq "## [$TAG]" "$RUNNER_TEMP/main-CHANGELOG.md"; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet "$TAG_SHA" origin/main -- CHANGELOG.md; then
            echo '::error::CHANGELOG.md changed on main after the release tag; reconcile it before continuing.'
            exit 1
          fi

          BRANCH="release/changelog-$TAG"
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$PR_NUMBER" ]]; then
            PR_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
            git fetch origin "$BRANCH"
            git show "$PR_SHA:CHANGELOG.md" > "$RUNNER_TEMP/pr-CHANGELOG.md"
            if ! cmp -s "$RUNNER_TEMP/generated-CHANGELOG.md" "$RUNNER_TEMP/pr-CHANGELOG.md"; then
              echo "::error::Existing changelog PR #$PR_NUMBER differs from generated output. Resolve it before retrying."
              exit 1
            fi
          else
            git switch --create "$BRANCH" origin/main
            cp "$RUNNER_TEMP/generated-CHANGELOG.md" CHANGELOG.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md
            git commit -m "docs(changelog): update $TAG release notes"
            git push origin "$BRANCH"
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "docs(changelog): update $TAG release notes" --body "Generated from the commits in $TAG. Review and merge this changelog PR, then rerun the Release workflow with the same tag.")"
            PR_NUMBER="${PR_URL##*/}"
          fi

          gh workflow run CI --ref "$BRANCH"
          RUN_ID=''
          for _ in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 10 --json databaseId,headSha | jq -r --arg sha "$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')" '.[] | select(.headSha == $sha) | .databaseId' | head -n 1)"
            [[ -n "$RUN_ID" ]] && break
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo '::error::Timed out waiting for changelog PR CI.'
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status
          echo "pending=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Changelog PR ready for review"
            echo "PR #$PR_NUMBER passed CI. Merge it manually, review the Release Notes draft content, then rerun Release for $TAG."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop until changelog PR is manually merged
        if: steps.changelog.outputs.pending == 'true'
        run: echo 'Changelog PR passed CI. Manual merge and a Release workflow retry are required.'

      - name: Confirm changelog has reached main
        if: steps.existing.outputs.exists == 'false' && steps.changelog.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          TAG_SHA: ${{ needs.validate-tag.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-CHANGELOG.md"
          grep -Fq "## [$TAG]" "$RUNNER_TEMP/main-CHANGELOG.md"

      - name: Create draft Release for human review
        if: steps.existing.outputs.exists == 'false' && steps.changelog.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          TAG_SHA: ${{ needs.validate-tag.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION_CORE="${TAG#v}"
          VERSION_CORE="${VERSION_CORE%%+*}"
          RELEASE_ARGS=(--draft --title "$TAG" --target "$TAG_SHA" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$VERSION_CORE" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          if gh release create "$TAG" "${RELEASE_ARGS[@]}"; then
            echo "Created draft Release $TAG; a maintainer must review the notes and publish it manually."
          else
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/created-release.json" 2>/dev/null \
                && [[ "$(php scripts/ReleaseVersion.php --release-state "$TAG" "$TAG_SHA" "$TAG_SHA" "$RUNNER_TEMP/created-release.json")" == draft-exists ]]; then
              echo "Release creation returned an error, but GitHub confirms the matching draft exists; no second draft was created."
            else
              echo '::error::Release creation outcome is unresolved. Inspect the tag and Release state before retrying.'
              exit 1
            fi
          fi
