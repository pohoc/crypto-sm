name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v, for example 1.2.3
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
      - id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          git show-ref --tags --verify --quiet "refs/tags/v$VERSION" && exit 1 || true
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  full-ci:
    needs: validate-version
    uses: ./.github/workflows/_ci.yml
    secrets: inherit

  publish:
    name: Create tag and GitHub Release
    needs: [validate-version, full-ci]
    if: ${{ needs.full-ci.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify main and create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version.outputs.tag }}
          EXPECTED_SHA: ${{ needs.validate-version.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$EXPECTED_SHA"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
